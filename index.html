    function App() {
      const [selectedArtwork, setSelectedArtwork] = useState(null);
      const [collectorPortalOpen, setCollectorPortalOpen] = useState(false);
      const [inquiryTarget, setInquiryTarget] = useState(null);

      const handleOpenCollectorPortal = (targetArtwork = null) => {
        setInquiryTarget(targetArtwork);
        setCollectorPortalOpen(true);
      };

      const handleNextArtwork = () => {
        if (!selectedArtwork) return;
        const currentIndex = ARTWORKS_DATA.findIndex((a) => a.id === selectedArtwork.id);
        const nextIndex = (currentIndex + 1) % ARTWORKS_DATA.length;
        setSelectedArtwork(ARTWORKS_DATA[nextIndex]);
      };

      const handlePrevArtwork = () => {
        if (!selectedArtwork) return;
        const currentIndex = ARTWORKS_DATA.findIndex((a) => a.id === selectedArtwork.id);
        const prevIndex = (currentIndex - 1 + ARTWORKS_DATA.length) % ARTWORKS_DATA.length;
        setSelectedArtwork(ARTWORKS_DATA[prevIndex]);
      };

      return (
        <div className="bg-canvas text-obsidian min-h-screen font-sans selection:bg-cyan-neon selection:text-obsidian">
          <Navbar onOpenCollectorPortal={() => handleOpenCollectorPortal()} />
          <Hero onOpenCollectorPortal={() => handleOpenCollectorPortal()} />
          <Gallery
            artworks={ARTWORKS_DATA}
            onSelectArtwork={(artwork) => setSelectedArtwork(artwork)}
          />
          <CraftSection />
          <AboutSection />
          <ManifestoSection />
          <Footer onOpenCollectorPortal={() => handleOpenCollectorPortal()} />

          <ArtworkModal
            artwork={selectedArtwork}
            onClose={() => setSelectedArtwork(null)}
            onInquire={(artwork) => handleOpenCollectorPortal(artwork)}
            onNext={handleNextArtwork}
            onPrev={handlePrevArtwork}
          />

          <CollectorPortalModal
            isOpen={collectorPortalOpen}
            onClose={() => setCollectorPortalOpen(false)}
            selectedArtwork={inquiryTarget}
          />
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
